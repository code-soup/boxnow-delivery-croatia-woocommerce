name: Deploy Production

on:
    workflow_dispatch:
    push:
        branches:
            - develop

# Only one production deploy at a time; do not cancel an in-flight push to master.
concurrency:
    group: wp-plugin-production-deploy
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout develop branch
              uses: actions/checkout@v5
              with:
                  ref: develop
                  fetch-depth: 0

            - name: WordPress Plugin Production Deploy
              uses: code-soup/wp-plugin-production-deploy@v1.0.0
              with:
                  node-version: "22"
                  php-version: "8.1"
                  build-command: npm run build:prod
                  composer-install: "true"
                  target-branch: master
                  use-deployignore: "true"
